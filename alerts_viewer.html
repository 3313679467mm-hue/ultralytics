<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警可视化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { opacity: 0.8; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stat-card .value { font-size: 36px; font-weight: bold; color: #667eea; }
        .stat-card .label { color: #666; font-size: 14px; margin-top: 5px; }
        .filters { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .filters input, .filters button { padding: 8px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .filters button { background: #667eea; color: white; border: none; cursor: pointer; }
        .filters button:hover { background: #5a6fd6; }
        .alert-list { display: grid; gap: 15px; }
        .alert-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; }
        .alert-image { width: 200px; min-height: 150px; background: #eee; cursor: pointer; flex-shrink: 0; }
        .alert-image img { width: 100%; height: 100%; object-fit: cover; }
        .alert-info { padding: 15px; flex: 1; }
        .alert-info h3 { color: #e74c3c; margin-bottom: 10px; }
        .alert-info p { color: #666; font-size: 14px; margin: 5px 0; }
        .alert-info .badge { display: inline-block; background: #667eea; color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
        .alert-actions { padding: 15px; display: flex; align-items: center; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .btn-delete:hover { background: #c0392b; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .pagination button { padding: 8px 15px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
        .pagination button:hover { background: #667eea; color: white; border-color: #667eea; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { max-width: 90%; max-height: 90%; }
        .modal-content img { max-width: 100%; max-height: 80vh; border-radius: 8px; }
        .modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 36px; cursor: pointer; }
        .empty { text-align: center; padding: 60px 20px; color: #999; }
        .chart-container { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .chart-container h3 { margin-bottom: 15px; color: #333; }
        .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 10px; }
        .bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .bar { width: 100%; max-width: 40px; background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 4px 4px 0 0; transition: height 0.3s; min-height: 2px; }
        .bar-label { font-size: 11px; color: #666; margin-top: 5px; text-align: center; }
        .bar-value { font-size: 12px; color: #333; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>告警可视化</h1>
        <p>手机检测系统 - 实时告警记录</p>
    </div>
    <div class="container">
        <div class="stats" id="stats"></div>
        <div class="chart-container">
            <h3>近7天告警趋势</h3>
            <div class="bar-chart" id="trend-chart"></div>
        </div>
        <div class="filters">
            <label>日期过滤:</label>
            <input type="date" id="date-filter">
            <button onclick="loadAlerts()">查询</button>
            <button onclick="clearFilter()">清除</button>
            <button onclick="refreshAll()" style="background:#27ae60;">刷新</button>
        </div>
        <div class="alert-list" id="alert-list"></div>
        <div class="pagination" id="pagination"></div>
    </div>
    <div class="modal" id="image-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <img id="modal-image" src="" alt="告警图片">
        </div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        let currentPage = 0;
        const pageSize = 20;

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/api/alerts/stats`);
                const data = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card"><div class="value">${data.total}</div><div class="label">总告警数</div></div>
                    <div class="stat-card"><div class="value">${data.today}</div><div class="label">今日告警</div></div>
                    <div class="stat-card"><div class="value">${data.trend.length > 0 ? data.trend[0].count : 0}</div><div class="label">最近一天</div></div>
                `;
                renderTrendChart(data.trend);
            } catch (e) { console.error('加载统计失败', e); }
        }

        function renderTrendChart(trend) {
            const container = document.getElementById('trend-chart');
            if (!trend || trend.length === 0) { container.innerHTML = '<p style="color:#999;width:100%;text-align:center;">暂无数据</p>'; return; }
            const maxCount = Math.max(...trend.map(t => t.count), 1);
            container.innerHTML = trend.slice(0, 7).reverse().map(t => `
                <div class="bar-item">
                    <div class="bar-value">${t.count}</div>
                    <div class="bar" style="height:${(t.count / maxCount) * 120}px"></div>
                    <div class="bar-label">${t.date.slice(5)}</div>
                </div>
            `).join('');
        }

        async function loadAlerts() {
            const date = document.getElementById('date-filter').value;
            const url = `${API_BASE}/api/alerts?limit=${pageSize}&offset=${currentPage * pageSize}${date ? '&date=' + date : ''}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                renderAlerts(data.alerts);
                renderPagination(data.total);
            } catch (e) { console.error('加载告警失败', e); }
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alert-list');
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '<div class="empty"><p>暂无告警记录</p></div>';
                return;
            }
            container.innerHTML = alerts.map(a => `
                <div class="alert-card">
                    <div class="alert-image" onclick="viewImage(${a.id})">
                        <img src="${API_BASE}/api/alerts/image/${a.id}" alt="告警图片" loading="lazy">
                    </div>
                    <div class="alert-info">
                        <h3>️ 检测到玩手机行为</h3>
                        <p>时间: ${a.timestamp}</p>
                        <p>连续帧: <span class="badge">${a.consecutive_frames} 帧</span></p>
                        <p>检测: ${a.detections || 'N/A'}</p>
                    </div>
                    <div class="alert-actions">
                        <button class="btn-delete" onclick="deleteAlert(${a.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const container = document.getElementById('pagination');
            container.innerHTML = `
                <button onclick="goPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>上一页</button>
                <span style="padding:8px;">第 ${currentPage + 1} / ${totalPages || 1} 页 (共 ${total} 条)</span>
                <button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>下一页</button>
            `;
        }

        function goPage(page) { currentPage = page; loadAlerts(); }
        function clearFilter() { document.getElementById('date-filter').value = ''; currentPage = 0; loadAlerts(); }
        function refreshAll() { currentPage = 0; loadStats(); loadAlerts(); }
        function viewImage(id) { document.getElementById('modal-image').src = `${API_BASE}/api/alerts/image/${id}`; document.getElementById('image-modal').classList.add('active'); }
        function closeModal() { document.getElementById('image-modal').classList.remove('active'); }

        async function deleteAlert(id) {
            if (!confirm('确定删除此告警记录？')) return;
            try {
                await fetch(`${API_BASE}/api/alerts/${id}`, { method: 'DELETE' });
                loadAlerts();
                loadStats();
            } catch (e) { alert('删除失败'); }
        }

        loadStats();
        loadAlerts();
    </script>
</body>
</html>
