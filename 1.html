<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>可爱表情助手</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
        font-family: "Microsoft YaHei", sans-serif;
      }

      /* 脸部容器 */
      .face-container {
        position: relative;
        width: 200px;
        height: 200px;
        background-color: #ffdb58; /* 暖黄色 */
        border-radius: 50%;
        box-shadow:
          inset -10px -10px 20px rgba(0, 0, 0, 0.1),
          0 10px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s ease;
        margin-bottom: 30px;
      }

      /* 眼睛 */
      .eye-socket {
        position: absolute;
        top: 70px;
        width: 45px;
        height: 45px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .left-eye {
        left: 40px;
      }
      .right-eye {
        right: 40px;
      }

      .pupil {
        width: 20px;
        height: 20px;
        background: #333;
        border-radius: 50%;
        position: relative;
      }

      /* 嘴巴 - 初始状态（平静/微露） */
      .mouth {
        position: absolute;
        bottom: 40px;
        width: 60px;
        height: 20px;
        border: 4px solid #b38f00;
        border-top: none;
        border-radius: 0 0 30px 30px;
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      }

      /* 高兴状态：大笑 */
      .face-container.happy {
        background-color: #fffa90;
        transform: scale(1.05);
      }
      .face-container.happy .mouth {
        height: 40px;
        border-radius: 0 0 50px 50px;
        background-color: #ff6b6b;
        border-color: #900;
      }

      /* 难过状态：撇嘴 */
      .face-container.sad {
        background-color: #d1d1d1;
      }
      .face-container.sad .mouth {
        height: 15px;
        border: 4px solid #666;
        border-bottom: none;
        border-radius: 30px 30px 0 0;
        bottom: 30px;
      }

      /* 控制区域 */
      .controls {
        text-align: center;
      }
      .btn-group {
        margin-bottom: 20px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        transition: background 0.2s;
        margin: 0 5px;
      }
      #add-btn {
        background-color: #4caf50;
        color: white;
      }
      #del-btn {
        background-color: #f44336;
        color: white;
      }
      button:hover {
        opacity: 0.8;
      }

      #image-display {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        min-height: 100px;
      }
      .thumb {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        animation: popIn 0.3s ease-out;
      }
      @keyframes popIn {
        0% {
          transform: scale(0);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="face-container" id="face">
      <div class="eye-socket left-eye">
        <div class="pupil"></div>
      </div>
      <div class="eye-socket right-eye">
        <div class="pupil"></div>
      </div>
      <div class="mouth"></div>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button id="add-btn">插入一张图片 📸</button>
        <button id="del-btn">删除一张图片 🗑️</button>
      </div>
      <div id="image-display">
        <!-- 图片会显示在这里 -->
      </div>
    </div>

    <script>
      const face = document.getElementById("face");
      const pupils = document.querySelectorAll(".pupil");
      const imageDisplay = document.getElementById("image-display");
      const addBtn = document.getElementById("add-btn");
      const delBtn = document.getElementById("del-btn");

      // 1. 眼睛跟随鼠标转动逻辑
      document.addEventListener("mousemove", (e) => {
        pupils.forEach((pupil) => {
          // 获取眼眶的中心位置
          const rect = pupil.parentElement.getBoundingClientRect();
          const eyeCenterX = rect.left + rect.width / 2;
          const eyeCenterY = rect.top + rect.height / 2;

          // 计算鼠标相对于中心的角度
          const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);

          // 限制眼珠移动距离（不跑出眼眶）
          const distance = 12;
          const x = Math.cos(angle) * distance;
          const y = Math.sin(angle) * distance;

          pupil.style.transform = `translate(${x}px, ${y}px)`;
        });
      });

      // 2. 插入图片逻辑 (高兴)
      addBtn.addEventListener("click", () => {
        const img = document.createElement("img");
        img.src = `https://picsum.photos/80?random=${Math.random()}`; // 随机图
        img.className = "thumb";
        imageDisplay.appendChild(img);

        setFaceState("happy");
      });

      // 3. 删除图片逻辑 (难过)
      delBtn.addEventListener("click", () => {
        if (imageDisplay.lastElementChild) {
          imageDisplay.removeChild(imageDisplay.lastElementChild);
          setFaceState("sad");
        } else {
          // 如果没图了，恢复普通状态
          face.className = "face-container";
        }
      });

      // 设置表情状态并自动恢复
      let timer;
      function setFaceState(state) {
        clearTimeout(timer);
        face.className = "face-container " + state;

        // 2秒后恢复平静
        timer = setTimeout(() => {
          face.className = "face-container";
        }, 2000);
      }
    </script>
  </body>
</html>
